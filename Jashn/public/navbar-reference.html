<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navbar reference - Jashn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Tokens: ink #14161C, marigold #F5A524, light marigold #FFD98A, lilac #C9C6F0 */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #2E2A7A; color: #fff; }
.header {
  position: sticky; top: 0; z-index: 50;
  background-color: #14161C;
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
}
.inner {
  max-width: 1280px; height: 68px; margin: 0 auto; padding: 0 32px;
  display: flex; align-items: center; gap: 16px;
}
.brand {
  display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; border-radius: 8px;
}
.wordmark { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: #fff; }
.tagline {
  display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; color: #FFD98A;
  background: rgba(245, 165, 36, 0.16); border: 1px solid rgba(245, 165, 36, 0.4);
  padding: 4px 10px; border-radius: 999px; white-space: nowrap;
}
.spacer { flex: 1; }
.nav { display: flex; align-items: center; gap: 8px; height: 68px; }
.nav-link {
  position: relative; display: inline-flex; align-items: center; height: 68px; padding: 0 14px;
  font-size: 14px; font-weight: 600; color: #C9C6F0; text-decoration: none; border-radius: 4px;
}
.nav-link:hover { color: #fff; }
.nav-link.active { color: #fff; font-weight: 700; }
.nav-link.active::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
  background-color: #F5A524; border-radius: 3px 3px 0 0;
}
.actions { display: flex; align-items: center; gap: 12px; }
.dropdown-wrap { position: relative; }
.lang-btn {
  min-height: 44px; padding: 0 14px; border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.05);
  color: #fff; font: inherit; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
}
.lang-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.35); }
.chevron { transition: transform 0.2s ease; }
.chevron.open { transform: rotate(180deg); }
.lang-menu {
  position: absolute; top: calc(100% + 8px); right: 0; min-width: 210px;
  background: #FFFFFF; border: 1px solid #E6E7EE; border-radius: 14px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28); padding: 6px; z-index: 100; list-style: none; display: none;
}
.lang-menu.open { display: block; }
.lang-item {
  min-height: 48px; width: 100%; padding: 8px 14px; border-radius: 10px; border: 0;
  background: transparent; display: flex; align-items: center; justify-content: space-between;
  cursor: pointer; text-align: left; font: inherit;
}
.lang-item:hover { background: rgba(46, 42, 122, 0.05); }
.lang-item.active { background: rgba(46, 42, 122, 0.08); }
.native-name { font-size: 14px; font-weight: 700; color: #14161C; font-family: 'Noto Sans Devanagari', 'Plus Jakarta Sans', system-ui, sans-serif; }
.english-name { font-size: 12px; font-weight: 500; color: #5B6070; }
.theme-btn {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2);
  background: transparent; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.cta-btn {
  min-height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: #F5A524; color: #14161C;
  font: inherit; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap;
}
.cta-btn:hover { background: #E09217; }
.mobile-toggle {
  display: none; width: 44px; height: 44px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.2);
  background: transparent; color: #fff; align-items: center; justify-content: center; cursor: pointer;
}
.mobile-panel {
  display: none; position: absolute; top: 100%; left: 0; right: 0;
  background: #14161C; border-bottom: 1px solid rgba(255, 255, 255, 0.12); padding: 12px 16px;
  flex-direction: column; gap: 6px; z-index: 49;
}
.mobile-panel.open { display: flex; }
.mobile-nav-link {
  display: flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 8px;
  color: #C9C6F0; text-decoration: none; font-size: 15px; font-weight: 600;
}
.mobile-nav-link.active {
  color: #fff; font-weight: 700; background: rgba(255, 255, 255, 0.08); border-left: 3px solid #F5A524;
}
.brand:focus-visible, .nav-link:focus-visible, .lang-btn:focus-visible, .theme-btn:focus-visible, .cta-btn:focus-visible, .mobile-toggle:focus-visible, .mobile-nav-link:focus-visible {
  outline: 3px solid #FFD98A !important; outline-offset: 2px !important;
}
@media (max-width: 1100px) { .tagline { display: none; } }
@media (max-width: 820px) {
  .nav { display: none; }
  .mobile-toggle { display: flex; }
  .cta-text { display: none; }
  .cta-btn { width: 44px; height: 44px; padding: 0; justify-content: center; }
}
</style>
</head>
<body>
<header class="header">
<div class="inner">
  <a href="/" class="brand" aria-label="Jashn, home">
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <rect x="18" y="2" width="4" height="12" rx="2" fill="#F5A524" />
      <rect x="18" y="2" width="4" height="12" rx="2" fill="#F5A524" transform="rotate(90 20 20)" />
      <rect x="18" y="2" width="4" height="12" rx="2" fill="#F5A524" transform="rotate(180 20 20)" />
      <rect x="18" y="2" width="4" height="12" rx="2" fill="#F5A524" transform="rotate(270 20 20)" />
      <rect x="18.5" y="5" width="3" height="8" rx="1.5" fill="#FFD98A" transform="rotate(45 20 20)" />
      <rect x="18.5" y="5" width="3" height="8" rx="1.5" fill="#FFD98A" transform="rotate(135 20 20)" />
      <rect x="18.5" y="5" width="3" height="8" rx="1.5" fill="#FFD98A" transform="rotate(225 20 20)" />
      <rect x="18.5" y="5" width="3" height="8" rx="1.5" fill="#FFD98A" transform="rotate(315 20 20)" />
      <circle cx="20" cy="20" r="4.5" fill="#FFFFFF" />
    </svg>
    <span class="wordmark">Jashn</span>
  </a>
  <span class="tagline">GenAI Celebration Planner</span>
  <div class="spacer"></div>
  <nav class="nav" aria-label="Main">
    <a href="/" class="nav-link active" aria-current="page">Overview</a>
    <a href="/scenarios" class="nav-link">Scenarios</a>
  </nav>
  <div class="actions">
    <div class="dropdown-wrap">
      <button type="button" class="lang-btn" id="lang-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="lang-menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span id="lang-current">English</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="chevron" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <ul class="lang-menu" id="lang-menu" role="menu">
        <li role="none"><button type="button" role="menuitemradio" aria-checked="true" class="lang-item active" data-lang="en"><div><div class="native-name">English</div><div class="english-name">English</div></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E2A7A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button></li>
        <li role="none"><button type="button" role="menuitemradio" aria-checked="false" class="lang-item" data-lang="hi"><div><div class="native-name">हिन्दी</div><div class="english-name">Hindi</div></div></button></li>
        <li role="none"><button type="button" role="menuitemradio" aria-checked="false" class="lang-item" data-lang="mr"><div><div class="native-name">मराठी</div><div class="english-name">Marathi</div></div></button></li>
      </ul>
    </div>
    <button type="button" class="theme-btn" aria-pressed="false" aria-label="Switch to dark mode">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C9C6F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button type="button" class="cta-btn" aria-label="Start a new plan">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span class="cta-text">Start a new plan</span>
    </button>
    <button type="button" class="mobile-toggle" aria-label="Open navigation menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>
</div>
</header>
<script>
const btn = document.getElementById('lang-btn');
const menu = document.getElementById('lang-menu');
const chevron = btn.querySelector('.chevron');
btn.addEventListener('click', () => {
  const open = menu.classList.toggle('open');
  chevron.classList.toggle('open', open);
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
});
</script>
</body>
</html>
